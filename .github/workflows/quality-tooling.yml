name: Quality Tooling

on:
  push:
    # All branches — commits pushed between PRs (e.g. long-lived working branches
    # like pro-expansion-phase-1) must still get CI, not just main/develop.
    branches:
      - '**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'cmos/research/2026-10-s94-m06/**'
      - '.github/workflows/quality-tooling.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.eslintrc.cjs'
      - '.prettierrc'

jobs:
  quality:
    name: Lint, Format, Tests, Snapshots (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # s87-m08: unknown-project-disclosure.test.ts's CUT-7 gate diffs a PINNED COMMIT RANGE
          # (m04's own two commits) rather than the working tree, so it needs real history. The
          # default depth-1 checkout has neither SHA and the gate dies on a raw git error.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify formatting
        run: npm run format:check

      - name: Run unit tests
        env:
          CI: 'true'
        run: npm test -- --runInBand

      - name: Validate tool definition snapshots
        env:
          CI: 'true'
        run: npm run snapshots -- --ci

      - name: Validate sealed retrieval quality and prompt floors
        run: npm run test:retrieval-quality -- --output artifacts/retrieval-quality/latest.json

      - name: Upload aggregate retrieval acceptance
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-quality-node-${{ matrix.node }}
          path: artifacts/retrieval-quality/latest.json

      - name: Generate quality metrics
        run: npm run metrics

      - name: Upload metrics report
        uses: actions/upload-artifact@v4
        with:
          name: quality-metrics-node-${{ matrix.node }}
          path: artifacts/quality-metrics/latest.json

  first-run-e2e:
    name: First-run E2E (pack -> install -> drive stdio)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # s87-m08: unknown-project-disclosure.test.ts's CUT-7 gate diffs a PINNED COMMIT RANGE
          # (m04's own two commits) rather than the working tree, so it needs real history. The
          # default depth-1 checkout has neither SHA and the gate dies on a raw git error.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify built server
        run: npm run verify:dist

      # Packs the tarball, installs it into a temp dir, and drives the documented
      # getting-started quickstart over real MCP stdio against the INSTALLED server
      # (s77-m10). Guards the published first-run experience against silent breakage.
      - name: Run first-run E2E
        env:
          CI: 'true'
        run: npm run test:e2e-firstrun
