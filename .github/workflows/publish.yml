name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # No id-token / npm --provenance: provenance requires a PUBLIC source repo, but this
  # repo is the PRIVATE publish source (F2/F4). Provenance from a private repo → npm E422.

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Run tests
        env:
          CI: 'true'
        run: npm test -- --runInBand

      - name: Verify publish tarball
        run: npm pack --dry-run

      - name: Determine dist-tag
        id: dist_tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
            echo "Prerelease detected ($PACKAGE_VERSION) — publishing with dist-tag 'next'"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "Stable release ($PACKAGE_VERSION) — publishing with dist-tag 'latest'"
          fi

      - name: Publish package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          DIST_TAG="${{ steps.dist_tag.outputs.tag }}"
          # No --provenance: it requires a PUBLIC source repo; npm publishes from this
          # PRIVATE repo (F2/F4), so provenance fails with E422. Publish without it.
          if [[ "$PACKAGE_NAME" == @*/* ]]; then
            npm publish --access public --tag "$DIST_TAG"
          else
            npm publish --tag "$DIST_TAG"
          fi
