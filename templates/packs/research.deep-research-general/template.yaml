researchGuidance:
  promptTemplates:
    initialResearch: "Outline the research goals, audience, and decisions to inform. Gather 3-5 authoritative sources before synthesizing."
    followUpResearch: "Based on initial findings, deepen exploration on gaps, contradictions, or high-impact opportunities."
  toolUsageGuidance:
    googleSearch: "Start broad, prioritize recency and authority; capture executed queries for reproducibility."
    fileSearch: "Enable when internal research or docs exist; tag results with scope and audience."
    urlContext: "Use for longform sources that need deep read-through; extract key claims and evidence."
  workflowOptimization:
    iterativeRefinement: "Iterate in short loops: search → read → capture → decide next query; log pivots explicitly."
    qualityAssurance: "Require at least two independent sources per key insight; flag contradictory information and open questions."
