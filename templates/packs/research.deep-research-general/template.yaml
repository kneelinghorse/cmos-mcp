type: "deep-research-general"

# Gemini Deep Research configuration for general (non-technical) investigations
geminiDeepResearch:
  tools:
    googleSearch:
      enabled: true
      description: "Use Google Search to gather broad domain context and authoritative sources."
      notes: "Prefer primary sources, recent publications, and balanced viewpoints."
    fileSearch:
      enabled: false
      storeName: ""
      description: "Optional managed RAG store for internal docs or prior research."
      config:
        displayName: ""
        customMetadata: []
        chunkingConfig: null
      notes: "Enable when internal corpora are available; otherwise leave disabled."
    urlContext:
      enabled: false
      urls: []
      description: "Deep-read specific URLs (reports, PDFs, longform articles)."
      notes: "Populate URLs for targeted deep reads; leave empty for discovery-first missions."
  geminiCli:
    useCustomCommands: false
    customCommandPath: ""
    commandDescription: ""
    shellContextBlocks:
      - "!{pwd}"
    mcpServers: []
    workflow:
      depth:
        level: "standard" # quick | standard | comprehensive | exhaustive
        maxSearchIterations: 5
        requireMultipleSources: true
        crossValidationRequired: true
      breadth:
        scope: "focused" # narrow | focused | broad | expansive
        maxTopicsPerQuery: 3
        allowTopicExpansion: true
        relatedTopicsThreshold: 0.6
      sources:
        preferredDomains: []
        excludedDomains: []
        requireRecentSources: false
        minSourceCount: 3
        maxSourceCount: 8
        sourceTypes:
          - "academic"
          - "industry"
          - "news"
          - "documentation"
      citations:
        requireCitations: true
        citationFormat: "markdown"
        includeGroundingMetadata: true
        trackSearchQueries: true

